services:
  # https://<server>.<tailnet>.ts.net:8445 through host tailscale serve
  # (../tailscale-serve/serve.json). APP_URL and ASSET_URL in .env must be that
  # URL, port included, or links and assets point at the wrong origin.
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    ports:
      - "127.0.0.1:8104:80"
    restart: unless-stopped
    env_file:
      - .env
      - path: ../../server-base/timezone.env
        required: true
    environment:
      - PUID=1000
      - PGID=1000
      - DB_CONNECTION=sqlite
    volumes:
      - ./data:/config
