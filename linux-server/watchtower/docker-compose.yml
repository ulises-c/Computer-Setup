services:
  # Watchtower has no human UI. https://<server>.<tailnet>.ts.net/watchtower/
  # (host tailscale serve, ../tailscale-serve/serve.json) fronts only its
  # token-gated /v1/metrics API, so Uptime Kuma can health-check it.
  watchtower:
    extends:
      file: ../../server-base/watchtower/compose.yml
      service: watchtower
    ports:
      - "127.0.0.1:8105:8080"
    environment:
      # Metrics only (NOT the update endpoint), so the schedule keeps running —
      # only the update API disables periodic polls. GET /v1/metrics on :8080.
      WATCHTOWER_HTTP_API_METRICS: "true"
      WATCHTOWER_HTTP_API_TOKEN: "${WATCHTOWER_API_TOKEN}"
