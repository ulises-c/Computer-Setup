services:
  # GUI at https://<server>.<tailnet>.ts.net/syncthing/ through host tailscale
  # serve (../tailscale-serve/serve.json).
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    ports:
      - "127.0.0.1:8384:8384"
      # Peer sync is raw TCP/UDP, never through serve.
      - "22000:22000/tcp"   # sync protocol
      - "22000:22000/udp"   # sync protocol (QUIC)
      - "21027:21027/udp"   # local discovery
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      # All container interfaces, so the loopback publish above reaches it. A
      # non-loopback GUI address also turns off Syncthing's Host check, which
      # would reject the tailnet name ("Host check error"); the GUI password is
      # the guard.
      - STGUIADDRESS=0.0.0.0:8384
    volumes:
      - ./config:/config
      # Add a volume mount for each folder you want to sync, then configure
      # the path inside Syncthing's web UI. Example:
      # - /mnt/data:/sync/data
