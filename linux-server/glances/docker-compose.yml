services:
  # Tailscale sidecar — joins the tailnet as `glances`, terminating HTTPS for
  # https://glances.<tailnet>.ts.net. See ../HTTPS.md ("host-networked apps").
  #
  # Unlike the other services, glances is NOT moved into the sidecar's network
  # namespace — it must keep `network_mode: host` to read the host's real network
  # interfaces and processes. Instead the sidecar runs in its own netns and proxies
  # back to the host's glances port via host.docker.internal (the docker bridge
  # gateway), so glances' monitoring fidelity is untouched.
  glances-ts:
    image: tailscale/tailscale:latest
    container_name: glances-ts
    hostname: glances
    env_file:
      - path: ../../server-base/timezone.env
        required: true
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      # Requires TS_AUTHKEY to be allowed to apply tag:container (OAuth client, or
      # a tag-scoped auth key). Drop this line if using an untagged personal key.
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  glances:
    extends:
      file: ../../server-base/glances/compose.yml
      service: glances
    environment:
      # The sidecar proxies via host.docker.internal, so bind all interfaces.
      GLANCES_OPT: "-w"
      GLANCES_FS_SHOW: "^/etc/hostname$$,^/mnt/.+"
      GLANCES_FS_ALIAS: "/etc/hostname:system,/mnt/seagate4tb:media 4TB,/mnt/wd14tb:backup 14TB,/mnt/wd1tb:backup 1TB"
      GLANCES_SENSORS_SHOW: "^Package id 0$$,^Composite$$"
      GLANCES_SENSORS_ALIAS: "Package id 0:CPU,Composite:NVMe"
      # The DAS HDDs' used/free is read only while they are already in use (see
      # ../../server-base/glances/README.md); the last sample and its date persist here.
      GLANCES_HDD_ACTIVITY_STATS: "true"
      GLANCES_HDD_CACHE_FILE: "/var/lib/glances-hdd/hdd-cache.json"
    volumes:
      # NAS mounts (read-only) so glances `fs:` can report capacity.
      - /mnt:/mnt:ro
      - ./hdd-cache:/var/lib/glances-hdd
      # by-label names feed the shared disk-alias patch (WD14TB, WD_1TB, ...).
      - /dev/disk/by-label:/dev/disk/by-label:ro
