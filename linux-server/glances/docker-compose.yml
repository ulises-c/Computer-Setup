services:
  # https://<server>.<tailnet>.ts.net/glances/ through host tailscale serve
  # (../tailscale-serve/serve.json), proxied to :61208 on the host. glances
  # keeps network_mode: host to read the host's real interfaces and processes;
  # its web UI uses relative URLs, so it needs no base-path setting.
  glances:
    image: nicolargo/glances:4.5.4-full
    container_name: glances
    restart: unless-stopped
    pid: host
    privileged: true
    network_mode: host
    environment:
      - GLANCES_OPT=-w
      - GLANCES_ALLOWED_HOSTS=${GLANCES_ALLOWED_HOSTS}
      - TZ=America/Los_Angeles
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
      # Expose the NAS mounts (read-only) so glances `fs:` can report capacity.
      # Block-device I/O already works via pid:host; filesystem usage needs the
      # mounts visible inside the container.
      - /mnt:/mnt:ro
      # Stable disk aliasing: entrypoint reads /dev/disk/by-label/ to map
      # filesystem labels (Seagate_4TB, WD_1TB, WD14TB) to the current kernel
      # device name and monkey-patches Glances' diskio plugin, so Homepage
      # disk I/O widgets use persistent label names across reboots.
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./rename_disks.py:/rename_disks.py:ro
      - /dev/disk/by-label:/dev/disk/by-label:ro
      - /sys/class/block:/sys/class/block:ro
    command: /bin/sh /entrypoint.sh
