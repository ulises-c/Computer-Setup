services:
  # https://<server>.<tailnet>.ts.net/openspeedtest/ through host tailscale
  # serve (../tailscale-serve/serve.json), proxied to :3030.
  #
  # The :3030/:3031 publishes stay on all interfaces: an accurate LAN
  # throughput test must hit the server's LAN IP directly, since the tailnet
  # URL measures the VPN path. They are also the serve backend. Not the
  # default :3000/:3001, which collide with homepage and uptime-kuma.
  openspeedtest:
    image: openspeedtest/latest
    container_name: openspeedtest
    ports:
      - "3030:3000"   # HTTP  — http://<server-ip>:3030 (LAN test path)
      - "3031:3001"   # HTTPS — https://<server-ip>:3031 (self-signed)
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
