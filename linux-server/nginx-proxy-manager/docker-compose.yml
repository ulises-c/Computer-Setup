services:
  # NPM is the LAN HTTPS edge for clients that can't join the tailnet. Its
  # admin UI is at https://<server>.<tailnet>.ts.net:8447 through host
  # tailscale serve (../tailscale-serve/serve.json).
  #
  # Every publish is bound to NPM_BIND_IP (the server's LAN IP), never all
  # interfaces: on 0.0.0.0, Docker's DNAT for :443 could catch the server's own
  # requests to its tailnet name before host serve does
  # (docs/ONE_NODE_PER_HOST.md D7).
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "${NPM_BIND_IP:?set NPM_BIND_IP in .env}:80:80"     # HTTP proxy (redirects <hostname>.local → HTTPS)
      - "${NPM_BIND_IP:?set NPM_BIND_IP in .env}:443:443"   # HTTPS proxy
      - "${NPM_BIND_IP:?set NPM_BIND_IP in .env}:81:81"     # admin UI, LAN
      - "127.0.0.1:81:81"                                   # admin UI, serve backend
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
