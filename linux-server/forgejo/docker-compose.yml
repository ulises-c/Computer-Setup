services:
  # Tailscale Service svc:forgejo, hosted by the server node
  # (../tailscale-serve/serve.json): https://forgejo.<tailnet>.ts.net goes to
  # 127.0.0.1:3300, and git SSH on the Service's :22 to 127.0.0.1:2222. The
  # Service keeps the old node name, so ROOT_URL, SSH_DOMAIN, SSH_PORT=22 and
  # every clone URL stay the same.
  forgejo:
    # Pin to a major version tag to avoid surprise upgrades — check latest at:
    # https://codeberg.org/forgejo/forgejo/releases
    image: codeberg.org/forgejo/forgejo:15
    container_name: forgejo
    ports:
      - "127.0.0.1:3300:3000"
      - "127.0.0.1:2222:22"
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=${TZ:-America/Los_Angeles}
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__server__ROOT_URL=https://${FORGEJO_DOMAIN}/
      - FORGEJO__server__SSH_DOMAIN=${FORGEJO_DOMAIN}
      - FORGEJO__server__SSH_PORT=22
    volumes:
      - ${FORGEJO_DATA_PATH:-./data}:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Loopback static server for the homepage "forgejo-runner" card. The host
  # systemd timer (forgejo-runner-status.timer → runner-status.sh) writes
  # runner-status.json here; homepage is host-networked, so localhost reaches it.
  forgejo-runner-status:
    image: nginx:alpine
    container_name: forgejo-runner-status
    restart: unless-stopped
    ports:
      - "127.0.0.1:8098:80"
    volumes:
      - ./runner-status:/usr/share/nginx/html:ro
