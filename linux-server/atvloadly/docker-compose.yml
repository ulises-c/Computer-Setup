services:
  # Web UI at https://<server>.<tailnet>.ts.net:8448 through host tailscale
  # serve (../tailscale-serve/serve.json).
  atvloadly:
    image: bitxeno/atvloadly:latest
    container_name: atvloadly
    privileged: true
    # Apple TV discovery goes through the host's avahi-daemon via the
    # bind-mounted sockets below, not through this container's network.
    ports:
      - "127.0.0.1:8101:80"
    restart: unless-stopped
    volumes:
      - /etc/atvloadly:/data
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon:/var/run/avahi-daemon
