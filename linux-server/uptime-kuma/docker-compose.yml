services:
  # https://<server>.<tailnet>.ts.net:8444 through host tailscale serve
  # (../tailscale-serve/serve.json). Monitor list: ./monitors.md.
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - ./data:/app/data
