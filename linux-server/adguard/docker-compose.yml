services:
  # Web UI at https://<server>.<tailnet>.ts.net:8443 through host tailscale
  # serve (../tailscale-serve/serve.json). DNS never goes through serve: :53
  # stays host-published for LAN and tailnet clients.
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "53:53/tcp"   # DNS — host-published for LAN clients
      - "53:53/udp"
      # Web UI, loopback only (serve backend). First-run only: temporarily add
      # "127.0.0.1:3003:3000/tcp" here to re-run the setup wizard.
      - "127.0.0.1:8100:80"
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
