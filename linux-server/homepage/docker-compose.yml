services:
  # Root of the host node, https://<server>.<tailnet>.ts.net/, through host
  # tailscale serve (../tailscale-serve/serve.json). homepage stays
  # network_mode: host so it reaches the loopback helpers (tailscale-proxy on
  # :8089, glances on :61208, the status nginx containers) via localhost.
  homepage:
    extends:
      file: ../../server-base/homepage/compose.yml
      service: homepage
    volumes:
      - ./config:/app/config
      # Fetched by server-base/homepage/fetch-assets.sh; gitignored.
      - ./assets/icons:/app/public/icons:ro
      - ./assets/images:/app/public/images:ro
    env_file:
      - .env
    environment:
      # Every name clients use must be allow-listed, or homepage rejects the
      # request (its reverse-proxy host check). TAILSCALE_HOSTNAME and
      # HOMEPAGE_VAR_HOMEPAGE_DOMAIN both hold the host node's MagicDNS name,
      # the one serve forwards.
      HOMEPAGE_ALLOWED_HOSTS: "${HOSTNAME},${HOSTNAME}.local,localhost,${SERVER_IP},${TAILSCALE_HOSTNAME},${HOMEPAGE_VAR_HOMEPAGE_DOMAIN}"
      # LAN clients reach :3000 directly as well as through serve.
      HOSTNAME: "0.0.0.0"
