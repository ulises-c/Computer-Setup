        href: https://{{HOMEPAGE_VAR_GLANCES_DOMAIN}}/
        description: Capacity — /mnt/wd1tb
        server: my-docker
        container: glances
        widget:
          type: glances
          url: http://localhost:61208
          version: 4
          metric: fs:/mnt/wd1tb
