# Generated by server-base/homepage/generate.py from server-base/fleet.json and
# linux-server/homepage/settings.local.yaml. Edit those, then re-run the generator.
title: "Home Server"
theme: "dark"
color: "slate"
headerStyle: "boxed"
hideVersion: true
fullWidth: true
cardBlur: "sm"
useEqualHeights: true
topbarExtras:
  glances: "{{HOMEPAGE_VAR_MAIN_GLANCES_URL}}"
  net: "eno2"
  grouped: true
  label: "main server"
  disks:
    - "/etc/hostname"
    - "/mnt/seagate4tb"
    - "/mnt/wd14tb"
    - "/mnt/wd1tb"
  safeSSDHealth: true
  filesystemIntervalMs: 300000
  smartIntervalMs: 600000
  gpuTypes:
    intel0: "iGPU"
  gpuFields:
    intel0:
      - "Usage"
  wifi: false
  diskLabels:
    /etc/hostname: "System disk"
    /mnt/seagate4tb: "seagate4tb"
    /mnt/wd14tb: "wd14tb"
    /mnt/wd1tb: "wd1tb"
  temperatureLabels:
    - "NVMe"
  hddDisks:
    - "/mnt/seagate4tb"
    - "/mnt/wd14tb"
    - "/mnt/wd1tb"

layout:
  Servers:
    style: row
    columns: 3
  # Management | Network | Storage side-by-side in one row (nested groups under a
  # header-less parent; homepage lays the child groups out horizontally).
  Core:
    style: row
    columns: 3
    header: false
    Management:
      style: column
    Network:
      style: column
    Storage:
      style: column
  NAS:
    style: row
    columns: 2
