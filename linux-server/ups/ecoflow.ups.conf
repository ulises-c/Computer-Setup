# Not deployed by setup.sh: the EcoFlow is disconnected from this server and
# parked for another host. Append this stanza to that host's /etc/nut/ups.conf
# and install udev-ecoflow.rules there (see README.md).
#
# EcoFlow River 3 Plus — installed upstream of the CyberPower (wall -> EcoFlow
# -> CyberPower -> machine), as a second, monitoring-only UPS (NO shutdown
# wiring; upsmon only watches the primary CyberPower). Because it sits on the
# wall frontier, its ups.status reflects the actual grid: OB on wall loss is the
# early warning; the CyberPower downstream tracks the machine-supply cut seconds
# later. Options mirror the vendor's own "Power Manager NUT" package (usbhid-ups,
# forced EP1 in/out, ignorelb): the report descriptor is a standard Power-Device
# HID page — do NOT set explore=1 here or the driver falls back to the generic
# EXPLORE subdriver and reports only identity + a constant OB.
[ecoflow]
	driver = usbhid-ups
	port = auto
	vendorid = 3746
	productid = ffff
	usb_hid_ep_in = 1
	usb_hid_ep_out = 1
	ignorelb
	override.battery.runtime.low = -1
	desc = "EcoFlow River 3 Plus"
