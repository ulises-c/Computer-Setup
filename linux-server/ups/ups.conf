[cyberpower]
	driver = usbhid-ups
	port = auto
	vendorid = 0764
	productid = 0601
	desc = "CyberPower CST135UC2"
	# CyberPower firmware fires LOWBATT late (~10% charge). Uncomment to shut
	# down with more headroom, by charge or by remaining runtime (seconds):
	# override.battery.charge.low = 25
	# override.battery.runtime.low = 300

# EcoFlow River 3 Plus — installed upstream of the CyberPower (wall -> EcoFlow
# -> CyberPower -> machine), as a second, monitoring-only UPS (NO shutdown
# wiring; upsmon only watches the primary CyberPower). Because it sits on the
# wall frontier, its ups.status reflects the actual grid: OB on wall loss is
# the early warning; the CyberPower downstream tracks the machine-supply cut
# seconds later. Needs a recent NUT (2.8.4+ recommended) for reliable full HID
# descriptor handling; on older 2.8.x the driver may read partial data.
[ecoflow]
	driver = usbhid-ups
	port = auto
	vendorid = 3746
	productid = ffff
	explore = 1
	synchronous = no
	desc = "EcoFlow River 3 Plus"
