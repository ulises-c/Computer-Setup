services:
  # https://<server>.<tailnet>.ts.net/filebrowser/ through host tailscale serve
  # (../tailscale-serve/serve.json). Serve strips the mount, so the app answers
  # at /; FB_BASE_URL makes its links and assets carry the prefix.
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    ports:
      - "127.0.0.1:8102:80"
    environment:
      - FB_BASE_URL=/filebrowser
    restart: unless-stopped
    volumes:
      - ${FB_ROOT:-/}:/srv
      - ./database:/database
