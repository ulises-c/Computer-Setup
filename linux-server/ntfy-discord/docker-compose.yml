services:
  ntfy-discord:
    image: python:3-alpine
    container_name: ntfy-discord
    command: ["python3", "-u", "/app/relay.py"]
    # Host networking: ntfy is reached over the tailnet (MagicDNS on the host)
    # and Discord over the internet; the relay listens on nothing.
    network_mode: host
    user: "${RELAY_UID:-1000}:${RELAY_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
      - path: ../../server-base/timezone.env
        required: true
    environment:
      - RELAY_STATE_FILE=/state/last-id
      # Daily audit: topics ntfy received that are not relayed (relay.py).
      - RELAY_CACHE_DB=/ntfy-cache/cache.db
      - RELAY_AUDIT_STATE_FILE=/state/unrelayed-topics
    volumes:
      - ./relay.py:/app/relay.py:ro
      - ./state:/state
      # ntfy's message cache, read-only, for the audit.
      - ../ntfy/cache:/ntfy-cache:ro
    restart: unless-stopped
