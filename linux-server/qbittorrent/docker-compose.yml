services:
  # https://<server>.<tailnet>.ts.net/qbittorrent/ through host tailscale serve
  # (../tailscale-serve/serve.json). The UI uses relative URLs, and serve on
  # :443 sends a port-less Host, so qBittorrent's host validation passes.
  #
  # The Web UI "IP address" (Options → Web UI, or WebUI\Address in
  # config/qBittorrent/qBittorrent.conf) must be * (all container interfaces),
  # not 127.0.0.1: the publish below reaches the container's own interface.
  # The host side of the publish is loopback, so the UI is still not on the LAN.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    ports:
      - "127.0.0.1:8080:8080"
      # BitTorrent peer traffic is raw TCP/UDP, never through serve.
      - "6881:6881/tcp"
      - "6881:6881/udp"
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1001          # nas group — so downloads are shareable via Samba
      - TZ=America/Los_Angeles
      - WEBUI_PORT=8080
      - UMASK=002          # group-writable (664 files / 775 dirs) for nas members
    volumes:
      - ./config:/config
      - ${QBITTORRENT_DOWNLOADS_PATH:-./downloads}:/downloads
      # Whole 14TB drive, so qBittorrent can save/recheck data anywhere on it
      # (e.g. existing downloads under /nas/media), not just the downloads dir.
      - /mnt/wd14tb:/nas
