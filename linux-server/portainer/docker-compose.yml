services:
  # https://<server>.<tailnet>.ts.net:9443 through host tailscale serve
  # (../tailscale-serve/serve.json), the same port as on the other hosts.
  # Portainer ignores --base-url for some assets (portainer#12615), and a port
  # keeps its Docker-socket UI off the origin the path-mounted apps share.
  # 9000 is the plaintext UI; serve terminates TLS.
  portainer:
    extends:
      file: ../../server-base/portainer/compose.yml
      service: portainer
    ports:
      - "127.0.0.1:9000:9000"

volumes:
  portainer_data:
