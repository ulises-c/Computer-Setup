services:
  # Tailscale Service svc:ntfy, hosted by the server node
  # (../tailscale-serve/serve.json): https://ntfy.<tailnet>.ts.net goes to
  # 127.0.0.1:8103. The Service keeps the old node name, so NTFY_BASE_URL and
  # every phone subscription stay the same.
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command: serve
    ports:
      - "127.0.0.1:8103:80"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Los_Angeles
      # ntfy is behind a reverse proxy (tailscale serve) — trust X-Forwarded-For
      # so rate limiting / visitor identification uses the real client IP.
      - NTFY_BEHIND_PROXY=true
      # Without an explicit cache file ntfy keeps messages in memory only, so the
      # ./cache mount below did nothing and every alert was lost on restart —
      # which watchtower does on its own schedule.
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      # Default is 12h, which loses an alert nobody was awake for — the whole
      # point of caching. A month keeps enough history to correlate an incident
      # after the fact; the messages are plain text and attachments are off, so
      # the database stays small.
      - NTFY_CACHE_DURATION=30d
    volumes:
      - ./data:/var/lib/ntfy
      - ./cache:/var/cache/ntfy
