services:
  # HTTPS front door for the Pi's MotionEye (security cameras), which runs as a
  # host service on :8765. Decoupled sidecar in its own netns, proxying
  # :443 -> host.docker.internal:8765. https://motioneye-pi.<tailnet>.ts.net.
  motioneye-ts:
    image: tailscale/tailscale:latest
    container_name: motioneye-ts
    hostname: motioneye-pi
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 9.9.9.10
      - 1.1.1.1
    restart: unless-stopped
