# cupsd accepts a loopback connection only when Host is localhost or a
# loopback IP; it ignores ServerAlias there. Serve connects from loopback and
# passes the tailnet Host through, so this shim rewrites it.
server {
  listen 127.0.0.1:8631;
  client_max_body_size 0;

  location / {
    proxy_pass http://127.0.0.1:631;
    proxy_set_header Host localhost;
    proxy_redirect http://localhost:631/ /;
  }
}
