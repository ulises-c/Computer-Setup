services:
  # Tailnet front door for the Pi's host CUPS (:631):
  # https://<pi-hostname>.<tailnet>.ts.net:8449 -> host tailscale serve ->
  # 127.0.0.1:8631 (this shim) -> 127.0.0.1:631. See README.md for why serve
  # cannot proxy to :631 directly. The mounted file replaces nginx's default
  # server, so nothing here listens on :80, which the host AdGuard owns.
  cups-proxy:
    image: nginx:1.31.6-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    container_name: cups-proxy
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
