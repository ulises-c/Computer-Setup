        description: "Self-hosted git"
        siteMonitor: "https://{{HOMEPAGE_VAR_FORGEJO_DOMAIN}}"
    - adguard home:
        icon: "sh-adguard-home.svg"
        href: "https://{{HOMEPAGE_VAR_ADGUARD_DOMAIN}}/"
        description: "Primary DNS ad blocker"
        siteMonitor: "https://{{HOMEPAGE_VAR_ADGUARD_DOMAIN}}"
    - immich:
        icon: "sh-immich.svg"
        href: "https://{{HOMEPAGE_VAR_IMMICH_DOMAIN}}/"
