# Generated by server-base/homepage/generate.py from server-base/fleet.json and
# linux-pi/homepage/services.local.yaml. Edit those, then re-run the generator.
- Servers:
    - main server:
        icon: "sh-ubuntu.svg"
        href: "https://{{HOMEPAGE_VAR_MAIN_HOMEPAGE_DOMAIN}}/"
        description: "NAS — storage, media and core services"
        siteMonitor: "https://{{HOMEPAGE_VAR_MAIN_HOMEPAGE_DOMAIN}}"
        widgets:
          - type: "customapi"
            url: "{{HOMEPAGE_VAR_MAIN_GLANCES_URL}}/api/4/system"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "linux_distro"
                label: "OS"
              - field: "os_version"
                label: "Kernel"
              - field: "hostname"
                label: "Hostname"
          - type: "customapi"
            url: "{{HOMEPAGE_VAR_MAIN_GLANCES_URL}}/api/4/quicklook"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "cpu_name"
                label: "CPU"
              - field: "cpu_log_core"
                label: "Threads"
          - type: "customapi"
            url: "{{HOMEPAGE_VAR_MAIN_GLANCES_URL}}/api/4/mem"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "total"
                label: "RAM"
                format: "bytes"
    - pi:
        icon: "sh-raspberry-pi.svg"
        description: "MotionEye, CUPS and backup DNS (this server)"
        widgets:
          - type: "customapi"
            url: "http://127.0.0.1:61208/api/4/system"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "linux_distro"
                label: "OS"
              - field: "os_version"
                label: "Kernel"
              - field: "hostname"
                label: "Hostname"
          - type: "customapi"
            url: "http://127.0.0.1:61208/api/4/quicklook"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "cpu_name"
                label: "CPU"
              - field: "cpu_log_core"
                label: "Threads"
          - type: "customapi"
            url: "http://127.0.0.1:61208/api/4/mem"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "total"
                label: "RAM"
                format: "bytes"
    - game server:
        icon: "sh-steam.svg"
        href: "https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}/"
        description: "Dedicated game servers"
        siteMonitor: "https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}"
        widgets:
          - type: "customapi"
            url: "https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}/glances/api/4/system"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "linux_distro"
                label: "OS"
              - field: "os_version"
                label: "Kernel"
              - field: "hostname"
                label: "Hostname"
          - type: "customapi"
            url: "https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}/glances/api/4/quicklook"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "cpu_name"
                label: "CPU"
              - field: "cpu_log_core"
                label: "Threads"
          - type: "customapi"
            url: "https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}/glances/api/4/mem"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "total"
                label: "RAM"
                format: "bytes"

- Management:
    - glances:
        icon: sh-glances.svg
        href: https://{{HOMEPAGE_VAR_PI_NODE_DOMAIN}}/glances/
        description: System monitor
        server: my-docker
        container: glances
        widget:
          type: glances
          url: http://127.0.0.1:61208
          version: 4
          metric: cpu
    - portainer:
        icon: sh-portainer-light.svg
        href: https://{{HOMEPAGE_VAR_PI_NODE_DOMAIN}}:9443/
        description: Docker manager
        server: my-docker
        container: portainer
    - watchtower:
        icon: sh-watchtower.svg
        description: Automatic container updates
        server: my-docker
        container: watchtower
    - cockpit:
        icon: sh-cockpit-light.svg
        href: https://{{HOMEPAGE_VAR_PI_NODE_DOMAIN}}/cockpit/
        description: Server admin UI
        ping: https://127.0.0.1:9090

- Pi Services:
    - adguard (backup dns):
        icon: sh-adguard-home.svg
        href: https://{{HOMEPAGE_VAR_ADGUARD_PI_DOMAIN}}/
        description: Backup DNS resolver
        widget:
          type: adguard
          url: http://localhost:80
          username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"
    - motioneye:
        icon: sh-motioneye.svg
        href: https://{{HOMEPAGE_VAR_MOTIONEYE_DOMAIN}}/
        description: Security cameras
        siteMonitor: https://{{HOMEPAGE_VAR_MOTIONEYE_DOMAIN}}
    - cups:
        icon: sh-cups.svg
        href: https://{{HOMEPAGE_VAR_CUPS_DOMAIN}}/
        description: Print server
        siteMonitor: https://{{HOMEPAGE_VAR_CUPS_DOMAIN}}
    - backups:
        icon: sh-restic
        description: restic → main server (wd1tb + wd14tb)
        server: my-docker
        container: pi-backup-status
        widget:
          type: customapi
          url: http://localhost:8099/backup-status.json
          refreshInterval: 600000
          mappings:
            - field: status
              label: Status
              format: text
            - field: last_run
              label: Last run
              format: relativeDate
            - field: repo_size_bytes
              label: Repo size
              format: bytes

