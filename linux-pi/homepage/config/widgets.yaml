# Generated by server-base/homepage/generate.py from server-base/fleet.json and
# this host's topbar entry. Edit those, then re-run the generator.
- glances:
    url: "http://127.0.0.1:61208"
    version: 4
    label: "pi"
    cpu: true
    mem: true
    cputemp: true
    cpuSensorLabel: "CPU"
    uptime: true
    disk:
      - "/etc/hostname"
    expanded: true
- datetime:
    text_size: "xl"
    format:
      timeStyle: "short"
      dateStyle: "short"
      hourCycle: "h23"
