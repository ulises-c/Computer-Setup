services:
  # Pi dashboard, host-networked on :3001. Host tailscale serve publishes it at
  # the root of https://<pi-hostname>.<tailnet>.ts.net
  # (../tailscale-serve/serve.json).
  homepage:
    extends:
      file: ../../server-base/homepage/compose.yml
      service: homepage
    volumes:
      - ./config:/app/config
      # Fetched by server-base/homepage/fetch-assets.sh; gitignored.
      - ./assets/icons:/app/public/icons:ro
      - ./assets/images:/app/public/images:ro
    env_file:
      - .env
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "localhost,127.0.0.1,${HOMEPAGE_VAR_PI_HOSTNAME},${HOMEPAGE_VAR_PI_HOSTNAME}.local,${HOMEPAGE_VAR_PI_LAN_IP},${HOMEPAGE_VAR_PI_HOMEPAGE_DOMAIN}"
      # LAN clients reach :3001 directly as well as through serve; safe
      # because Homepage has no Docker socket, only the filtered proxy.
      HOSTNAME: "0.0.0.0"
      PORT: "3001"

  # Homepage's only route to Docker (config/docker.yaml); see the base file.
  docker-socket-proxy:
    extends:
      file: ../../server-base/homepage/compose.yml
      service: docker-socket-proxy
