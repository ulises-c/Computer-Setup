services:
  # Keeps every AdGuard replica (the Pi's, the game server's) in lockstep with
  # the primary (linux-server/adguard). Runs on the Pi, pulling origin ->
  # replicas on a cron. All URLs/credentials/toggles come from .env (gitignored). See ../README.md.
  adguardhome-sync:
    image: ghcr.io/bakito/adguardhome-sync:latest
    container_name: adguardhome-sync
    command: run
    env_file:
      - .env
      - path: ../../server-base/timezone.env
        required: true
    restart: unless-stopped
