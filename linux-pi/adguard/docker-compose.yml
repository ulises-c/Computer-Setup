services:
  # Secondary AdGuard Home on <pi-hostname>, the shared replica (rationale in
  # server-base/adguard-replica/compose.yml). Host tailscale serve publishes only
  # the :80 web UI, at https://<pi-hostname>.<tailnet>.ts.net:8443
  # (../tailscale-serve/serve.json); DNS never goes through serve.
  adguardhome:
    extends:
      file: ../../server-base/adguard-replica/compose.yml
      service: adguardhome
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
