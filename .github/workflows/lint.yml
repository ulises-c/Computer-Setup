name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: warning

  json-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          failed=0
          for f in $(find . -name '*.json' -not -path './.git/*'); do
            if ! jq empty "$f" 2>/dev/null; then
              echo "❌ Invalid JSON: $f"
              failed=1
            else
              echo "✓ $f"
            fi
          done
          exit $failed

  validate-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate packages.json schema
        run: bash scripts/validate-packages.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python syntax
        run: |
          mapfile -d '' files < <(find . -name '*.py' -not -path './.git/*' -print0)
          bash scripts/check-python-syntax.sh "${files[@]}"

      - name: Test Glances disk aliases
        working-directory: server-base/glances
        run: python3 -m unittest -v test_rename_disks.py

      - name: Test server-base Homepage generator (outputs current, cross-links)
        run: python3 server-base/tests/test_generate.py -v

      - name: Test ntfy to Discord relay
        run: python3 -m unittest discover -v -s linux-server/ntfy-discord/tests

      - name: Test game server (Dragonwilds, player log, backups)
        working-directory: linux-game-server/tests
        run: python3 -m unittest discover -v -p 'test_*.py'

  dryrun-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Root setup.sh dry-run on every platform
        run: bash scripts/dryrun-smoke.sh

  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test shared backup engine (failure status, sources, guards)
        run: bash server-base/backup/test-backup.sh

      - name: Test CUPS policy rendering
        run: bash linux-pi/cups/test-setup.sh

      - name: Test SSH config rendering
        run: bash SSH_and_GPG/test-create_ssh_key.sh

      - name: Test setup preflight helpers
        run: bash scripts/test-core-preflight.sh

      - name: Test Docker address-pool step
        run: bash scripts/test-docker-address-pools.sh

  zsh-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run zsh -n on zsh scripts
        run: |
          failed=0
          for f in $(find . -not -path './.git/*' \( -name '*.zsh' -o -name 'zshrc.example' \)); do
            if zsh -n "$f" 2>&1; then
              echo "✓ $f"
            else
              echo "❌ Syntax error: $f"
              failed=1
            fi
          done
          exit $failed
