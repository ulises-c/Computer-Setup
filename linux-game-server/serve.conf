# shellcheck shell=bash
# Sourced by server-base/serve.sh (bash). See that file for the variables.
# shellcheck disable=SC2034
# Lost City (vanilla 2004Scape) is retired from the default set; lostcity/README.md
# has the manual start. A stopped unless-stopped container stays down on reboot.
COMPOSE_DIRS=(homepage glances portainer watchtower backup rs-sdk 2004scape)
PRE_SERVE=(python3 scaffold.py)
WAIT_URL=http://127.0.0.1:3000/
ROUTES=(
  "443 / http://127.0.0.1:3000"
  # Glances' web UI uses relative URLs, so it works with the mount stripped.
  "443 /glances http://127.0.0.1:61208"
  "443 /cockpit https+insecure://127.0.0.1:9090/cockpit"
  "443 /rs-sdk http://127.0.0.1:8098"
  # RGB status JSON for this host's Homepage; a single file, not the directory.
  "443 /host-status/rgb.json /var/lib/host-status/rgb.json"
  # Portainer ignores --base-url for some assets (portainer#12615), so it keeps a port.
  "9443 / http://127.0.0.1:9000"
  # RS-SDK's web UI uses root-relative paths and cannot be mounted under a URL path.
  "9445 / http://127.0.0.1:8080"
  # RS-SDK direct WebSocket gateway; Tailscale Serve preserves WebSocket upgrades.
  "9446 / http://127.0.0.1:7781"
  # Fleet service (rs-sdk/fleet-service): bearer-token API for the bot hosts.
  "9447 / http://127.0.0.1:8100"
  # RS-SDK extra worlds (rs-sdk/worlds/worlds.conf): test world 100's web and gateway.
  "9448 / http://127.0.0.1:8180"
  "9449 / http://127.0.0.1:7791"
  # Machine-readable world list (2004scape/game_status.py) for world-hopping bots.
  "443 /rs-sdk-worlds.json $host_dir/2004scape/status/rs-sdk-worlds.json"
)
# Retired: this host no longer runs its own Uptime Kuma.
# Retired: Lost City's web client (9444) is no longer started by default.
RETIRED_PORTS=(3443 9444)
# Retired: Dragonwilds status is no longer shown on the other dashboards.
RETIRED_PATHS=("443 /dragonwilds" "443 /host-status")
