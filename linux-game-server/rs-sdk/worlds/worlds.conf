# Configured RS-SDK worlds (world.sh, worlds.py, game_status.py read this).
# One row per world. World 1 is the main stack (rs-sdk/docker-compose.yml,
# container rs-sdk-server, updated only by maintenance.sh and `world.sh promote`);
# every other row runs as its own container rs-sdk-world-<id> from
# worlds/world-compose.yml with `world.sh up <id>`.
#
# id: the engine NODE_ID and the world number players see (world 1 = node 10 is
#     the engine's convention for the first world). Never reuse 10 elsewhere.
# role: live = the image world 1 runs, open to everyone, hoppable by bots;
#       test = a candidate image, allowlist on, never a hop target.
#       `world.sh role <id> live|test` overrides it in the state dir.
# ports (all host-network, see README): web, management, game TCP, gateway
#       (internal), gateway (public), and the tailnet HTTPS ports Tailscale Serve
#       maps to web and public gateway (serve.conf).
#
# id  node  role  web   mgmt  game   gw    gw_pub  https_web  https_gw
1     10    live  8080  8899  43595  7780  7781    9445       9446
100   100   test  8180  8199  43600  7790  7791    9448       9449
