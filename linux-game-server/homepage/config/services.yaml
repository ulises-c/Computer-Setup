# Generated by server-base/homepage/generate.py from server-base/fleet.json and
# linux-game-server/homepage/services.local.yaml. Edit those, then re-run the generator.
- Servers:
    - main server:
        icon: "sh-ubuntu.svg"
        id: "server-main"
        href: "https://{{HOMEPAGE_VAR_MAIN_HOMEPAGE_DOMAIN}}/"
        description: "NAS — storage, media and core services"
        siteMonitor: "https://{{HOMEPAGE_VAR_MAIN_HOMEPAGE_DOMAIN}}"
        widgets:
          - type: "customapi"
            url: "{{HOMEPAGE_VAR_MAIN_GLANCES_URL}}/api/4/system"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "hostname"
                label: "Platform"
                format: "text"
                remap:
                  - any: true
                    to: "Dell OptiPlex 5060"
              - field: "hostname"
                label: "Board / SoC"
                format: "text"
                remap:
                  - any: true
                    to: "Dell 030VXY · Intel Q370"
              - field: "hostname"
                label: "CPU"
                format: "text"
                remap:
                  - any: true
                    to: "Intel Core i5-8500T · 6 cores / 6 threads"
          - type: "customapi"
            url: "{{HOMEPAGE_VAR_MAIN_GLANCES_URL}}/api/4/mem"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "total"
                label: "Memory"
                format: "float"
                scale: "1/1073741824"
                suffix: "GiB usable"
          - type: "customapi"
            url: "{{HOMEPAGE_VAR_MAIN_GLANCES_URL}}/api/4/system"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "hostname"
                label: "Graphics"
                format: "text"
                remap:
                  - any: true
                    to: "Intel UHD 630 · iGPU · shared RAM"
              - field: "linux_distro"
                label: "Software"
                format: "text"
                additionalField:
                  field: "os_version"
                  format: "text"
                  prefix: "·"
    - pi:
        icon: "sh-raspberry-pi.svg"
