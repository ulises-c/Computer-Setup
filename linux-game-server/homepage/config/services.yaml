          - type: "customapi"
            url: "{{HOMEPAGE_VAR_PI_GLANCES_URL}}/api/4/mem"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "total"
                label: "Memory"
                format: "float"
                scale: "1/1073741824"
                suffix: "GiB usable"
          - type: "customapi"
            url: "{{HOMEPAGE_VAR_PI_GLANCES_URL}}/api/4/system"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "hostname"
