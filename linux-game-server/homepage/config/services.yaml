- Servers:
    - main server:
        icon: mdi-server
        href: https://{{HOMEPAGE_VAR_MAIN_HOMEPAGE_DOMAIN}}/
        description: NAS — storage, media and core services
        siteMonitor: https://{{HOMEPAGE_VAR_MAIN_HOMEPAGE_DOMAIN}}
    - pi:
        icon: mdi-raspberry-pi
        href: https://{{HOMEPAGE_VAR_PI_HOMEPAGE_DOMAIN}}/
        description: MotionEye, CUPS and backup DNS
        siteMonitor: https://{{HOMEPAGE_VAR_PI_HOMEPAGE_DOMAIN}}
    - game server:
        icon: mdi-controller
        description: RuneScape Dragonwilds (this server)

- Games:
    - Dragonwilds:
        icon: mdi-sword-cross
        description: RuneScape Dragonwilds — UDP 7777 (LAN + tailnet)
        server: my-docker
        container: dragonwilds-status
        widget:
          type: customapi
          url: http://127.0.0.1:8096/dragonwilds-status.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: status
              label: Server
              format: text
            - field: players
              label: Players
              format: number
            - field: player_names
              label: Online
              format: text
            - field: join_code
              label: Join code
              format: text
            - field: connect_lan
              label: LAN
              format: text
            - field: connect_tailnet
              label: Tailnet
              format: text
            - field: last_save
              label: Last save
              format: relativeDate
            - field: uptime_seconds
              label: Uptime
              format: duration
            - field: memory_bytes
              label: Memory
              format: bytes
            - field: save_bytes
              label: World size
              format: bytes
            - field: update_status
              label: Build
              format: text
