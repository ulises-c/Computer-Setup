# Generated by server-base/homepage/generate.py from server-base/fleet.json and
# linux-game-server/homepage/services.local.yaml. Edit those, then re-run the generator.
- Servers:
    - main server:
        icon: "sh-ubuntu.svg"
        href: "https://{{HOMEPAGE_VAR_MAIN_HOMEPAGE_DOMAIN}}/"
        description: "NAS — storage, media and core services"
        siteMonitor: "https://{{HOMEPAGE_VAR_MAIN_HOMEPAGE_DOMAIN}}"
        widgets:
          - type: "customapi"
            url: "{{HOMEPAGE_VAR_MAIN_GLANCES_URL}}/api/4/system"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "linux_distro"
                label: "OS"
              - field: "os_version"
                label: "Kernel"
              - field: "hostname"
                label: "Hostname"
          - type: "customapi"
            url: "{{HOMEPAGE_VAR_MAIN_GLANCES_URL}}/api/4/quicklook"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "cpu_name"
                label: "CPU"
              - field: "cpu_log_core"
                label: "Threads"
          - type: "customapi"
            url: "{{HOMEPAGE_VAR_MAIN_GLANCES_URL}}/api/4/mem"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "total"
                label: "RAM"
                format: "bytes"
    - pi:
        icon: "sh-raspberry-pi.svg"
        href: "https://{{HOMEPAGE_VAR_PI_HOMEPAGE_DOMAIN}}/"
        description: "MotionEye, CUPS and backup DNS"
        siteMonitor: "https://{{HOMEPAGE_VAR_PI_HOMEPAGE_DOMAIN}}"
        widgets:
          - type: "customapi"
            url: "{{HOMEPAGE_VAR_PI_GLANCES_URL}}/api/4/system"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "linux_distro"
                label: "OS"
              - field: "os_version"
                label: "Kernel"
              - field: "hostname"
                label: "Hostname"
          - type: "customapi"
            url: "{{HOMEPAGE_VAR_PI_GLANCES_URL}}/api/4/quicklook"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "cpu_name"
                label: "CPU"
              - field: "cpu_log_core"
                label: "Threads"
          - type: "customapi"
            url: "{{HOMEPAGE_VAR_PI_GLANCES_URL}}/api/4/mem"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "total"
                label: "RAM"
                format: "bytes"
    - game server:
        icon: "sh-steam.svg"
        description: "Dedicated game servers (this server)"
        widgets:
          - type: "customapi"
            url: "http://127.0.0.1:61208/api/4/system"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "linux_distro"
                label: "OS"
              - field: "os_version"
                label: "Kernel"
              - field: "hostname"
                label: "Hostname"
          - type: "customapi"
            url: "http://127.0.0.1:61208/api/4/quicklook"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "cpu_name"
                label: "CPU"
              - field: "cpu_log_core"
                label: "Threads"
          - type: "customapi"
            url: "http://127.0.0.1:61208/api/4/mem"
            refreshInterval: 3600000
            display: "list"
            mappings:
              - field: "total"
                label: "RAM"
                format: "bytes"

- Game server:
    - glances:
        icon: sh-glances.svg
        href: https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}/glances/
        description: System monitor
        server: my-docker
        container: glances
        widget:
          type: glances
          url: http://127.0.0.1:61208
          version: 4
          metric: cpu
    - portainer:
        icon: sh-portainer-light.svg
        href: https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}:9443/
        description: Docker manager
        server: my-docker
        container: portainer
    - watchtower:
        icon: sh-watchtower.svg
        description: Automatic container updates
        server: my-docker
        container: watchtower
    - cockpit:
        icon: sh-cockpit-light.svg
        href: https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}/cockpit/
        description: Server admin UI
        ping: https://127.0.0.1:9090
    - backups:
        icon: sh-restic
        description: restic → main server (wd1tb + wd14tb)
        server: my-docker
        container: backup-status
        widget:
          type: customapi
          url: http://127.0.0.1:8099/backup-status.json
          refreshInterval: 600000
          mappings:
            - field: status
              label: Status
              format: text
            - field: last_run
              label: Last run
              format: relativeDate
            - field: repo_size_bytes
              label: Repo size
              format: bytes
    - rgb lighting:
        icon: mdi-palette
        description: OpenRGB devices and active mode (refreshed every 10 min)
        widget:
          type: customapi
          url: https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}/host-status/rgb.json
          refreshInterval: 300000
          display: dynamic-list
          mappings:
            items: devices
            name: name
            label: mode

- Games:
    - game server:
        icon: /icons/dragonwilds.ico
        description: Dragonwilds dedicated server — host, build, backups
        server: my-docker
        container: dragonwilds-status
        widget:
          type: customapi
          url: http://127.0.0.1:8096/dragonwilds-status.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: status
              label: Server
              format: text
            - field: server_name
              label: Name
              format: text
            - field: online_capacity
              label: Players
              format: text
            - field: last_join_name
              label: Last join
              format: text
            - field: last_join
              label: Last join at
              format: relativeDate
            - field: uptime_seconds
              label: Uptime
              format: duration
            - field: cpu_percent
              label: CPU (1 core)
              format: percent
            - field: memory_bytes
              label: Memory
              format: bytes
            - field: disk_free_bytes
              label: Disk free
              format: bytes
            - field: build
              label: Build
              format: text
            - field: update_status
              label: Update
              format: text
            - field: update_checked
              label: Checked
              format: relativeDate
            - field: auto_update
              label: Auto-update
              format: text
            - field: backup_status
              label: Backup
              format: text
            - field: last_backup
              label: Last backup
              format: relativeDate
            - field: worlds_on_disk
              label: Worlds
              format: text
    - Ollie-GS:
        id: dragonwilds-world
        icon: /icons/dragonwilds.ico
        description: Active world — UDP 7777 (LAN + tailnet)
        server: my-docker
        container: dragonwilds-status
        widget:
          type: customapi
          url: http://127.0.0.1:8096/dragonwilds-status.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: world
              label: World
              format: text
            - field: world_id
              label: World ID
              format: text
            - field: world_owner
              label: Owner
              format: text
            - field: online_capacity
              label: Players
              format: text
            - field: player_names
              label: Online
              format: text
            - field: join_code
              label: Join code
              format: text
            - field: join_password
              label: Join pass
              format: text
            - field: connect_lan
              label: LAN
              format: text
            - field: connect_tailnet
              label: Tailnet
              format: text
            - field: last_save
              label: Last save
              format: relativeDate
            - field: save_bytes
              label: World size
              format: bytes

