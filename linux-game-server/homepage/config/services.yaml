# Generated by server-base/homepage/generate.py from server-base/fleet.json and
# linux-game-server/homepage/services.local.yaml. Edit those, then re-run the generator.
- Servers:
    - main server:
        icon: "sh-ubuntu.svg"
        href: "https://{{HOMEPAGE_VAR_MAIN_HOMEPAGE_DOMAIN}}/"
        description: "NAS — storage, media and core services"
        siteMonitor: "https://{{HOMEPAGE_VAR_MAIN_HOMEPAGE_DOMAIN}}"
        widgets:
          - type: "glances"
            url: "{{HOMEPAGE_VAR_MAIN_GLANCES_URL}}"
            version: 4
            metric: "info"
            refreshInterval: 10000
    - pi:
        icon: "sh-raspberry-pi.svg"
        href: "https://{{HOMEPAGE_VAR_PI_HOMEPAGE_DOMAIN}}/"
        description: "MotionEye, CUPS and backup DNS"
        siteMonitor: "https://{{HOMEPAGE_VAR_PI_HOMEPAGE_DOMAIN}}"
        widgets:
          - type: "glances"
            url: "{{HOMEPAGE_VAR_PI_GLANCES_URL}}"
            version: 4
            metric: "info"
            refreshInterval: 10000
    - game server:
        icon: "/icons/dragonwilds.ico"
        description: "RuneScape: Dragonwilds (this server)"
        widgets:
          - type: "glances"
            url: "http://127.0.0.1:61208"
            version: 4
            metric: "info"
            refreshInterval: 10000
          - type: "customapi"
            url: "http://127.0.0.1:8096/dragonwilds-status.json"
            refreshInterval: 60000
            display: "list"
            mappings:
              - field: "status"
                label: "World"
                format: "text"
              - field: "online_capacity"
                label: "Players"
                format: "text"
              - field: "uptime_seconds"
                label: "Uptime"
                format: "duration"

- Game server:
    - glances:
        icon: sh-glances.svg
        href: https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}/glances/
        description: System monitor
        server: my-docker
        container: glances
        widget:
          type: glances
          url: http://127.0.0.1:61208
          version: 4
          metric: cpu
    - portainer:
        icon: sh-portainer-light.svg
        href: https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}:9443/
        description: Docker manager
        server: my-docker
        container: portainer
    - watchtower:
        icon: sh-watchtower.svg
        description: Automatic container updates
        server: my-docker
        container: watchtower
    - cockpit:
        icon: sh-cockpit-light.svg
        href: https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}/cockpit/
        description: Server admin UI
        ping: https://127.0.0.1:9090
    - backups:
        icon: sh-restic
        description: restic → main server (wd1tb + wd14tb)
        server: my-docker
        container: backup-status
        widget:
          type: customapi
          url: http://127.0.0.1:8099/backup-status.json
          refreshInterval: 600000
          mappings:
            - field: status
              label: Status
              format: text
            - field: last_run
              label: Last run
              format: relativeDate
            - field: repo_size_bytes
              label: Repo size
              format: bytes

- Games:
    - game server:
        icon: /icons/dragonwilds.ico
        description: Overall game server health and activity
        server: my-docker
        container: dragonwilds-status
        widget:
          type: customapi
          url: http://127.0.0.1:8096/dragonwilds-status.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: status
              label: Server
              format: text
            - field: online_capacity
              label: Players
              format: text
            - field: uptime_seconds
              label: Uptime
              format: duration
            - field: memory_bytes
              label: Memory
              format: bytes
            - field: disk_free_bytes
              label: Disk free
              format: bytes
            - field: update_status
              label: Build
              format: text
    - Ollie-GS:
        id: dragonwilds-world
        icon: /icons/dragonwilds.ico
        description: RuneScape Dragonwilds — UDP 7777 (LAN + tailnet)
        server: my-docker
        container: dragonwilds-status
        widget:
          type: customapi
          url: http://127.0.0.1:8096/dragonwilds-status.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: status
              label: Server
              format: text
            - field: online_capacity
              label: Players
              format: text
            - field: player_names
              label: Online
              format: text
            - field: join_code
              label: Join code
              format: text
            - field: join_password
              label: Join pass
              format: text
            - field: connect_lan
              label: LAN
              format: text
            - field: connect_tailnet
              label: Tailnet
              format: text
            - field: last_save
              label: Last save
              format: relativeDate
            - field: uptime_seconds
              label: Uptime
              format: duration
            - field: memory_bytes
              label: Memory
              format: bytes
            - field: save_bytes
              label: World size
              format: bytes
            - field: update_status
              label: Build
              format: text

