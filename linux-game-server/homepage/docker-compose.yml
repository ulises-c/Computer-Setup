services:
  homepage:
    extends:
      file: ../../server-base/homepage/compose.yml
      service: homepage
    env_file:
      - .env
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "${HOMEPAGE_ALLOWED_HOSTS:?Run linux-game-server/setup.sh to create .env}"
    volumes:
      - ./config:/app/config
      # Fetched by server-base/homepage/fetch-assets.sh; gitignored.
      - ./assets/icons:/app/public/icons:ro
      - ./assets/images:/app/public/images:ro

  # Homepage's only route to Docker (config/docker.yaml); see the base file.
  docker-socket-proxy:
    extends:
      file: ../../server-base/homepage/compose.yml
      service: docker-socket-proxy
