services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.4.0
    container_name: homepage
    network_mode: host
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "${HOMEPAGE_ALLOWED_HOSTS:?Run linux-game-server/setup.sh to create .env}"
      HOSTNAME: "127.0.0.1"
      PORT: "3000"
    volumes:
      - ./config:/app/config
    restart: unless-stopped
