- Game server:
    - glances:
        icon: sh-glances.svg
        href: https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}/glances/
        description: System monitor
        server: my-docker
        container: glances
        widget:
          type: glances
          url: http://127.0.0.1:61208
          version: 4
          metric: cpu
    - portainer:
        icon: sh-portainer-light.svg
        href: https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}:9443/
        description: Docker manager
        server: my-docker
        container: portainer
    - watchtower:
        icon: sh-watchtower.svg
        description: Automatic container updates
        server: my-docker
        container: watchtower
    - cockpit:
        icon: sh-cockpit-light.svg
        href: https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}/cockpit/
        description: Server admin UI
        ping: https://127.0.0.1:9090

- Games:
    - game server:
        icon: /icons/dragonwilds.ico
        description: Overall game server health and activity
        server: my-docker
        container: dragonwilds-status
        widget:
          type: customapi
          url: http://127.0.0.1:8096/dragonwilds-status.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: status
              label: Server
              format: text
            - field: online_capacity
              label: Players
              format: text
            - field: uptime_seconds
              label: Uptime
              format: duration
            - field: memory_bytes
              label: Memory
              format: bytes
            - field: disk_free_bytes
              label: Disk free
              format: bytes
            - field: update_status
              label: Build
              format: text
    - Ollie-GS:
        id: dragonwilds-world
        icon: /icons/dragonwilds.ico
        description: RuneScape Dragonwilds — UDP 7777 (LAN + tailnet)
        server: my-docker
        container: dragonwilds-status
        widget:
          type: customapi
          url: http://127.0.0.1:8096/dragonwilds-status.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: status
              label: Server
              format: text
            - field: online_capacity
              label: Players
              format: text
            - field: player_names
              label: Online
              format: text
            - field: join_code
              label: Join code
              format: text
            - field: join_password
              label: Join pass
              format: text
            - field: connect_lan
              label: LAN
              format: text
            - field: connect_tailnet
              label: Tailnet
              format: text
            - field: last_save
              label: Last save
              format: relativeDate
            - field: uptime_seconds
              label: Uptime
              format: duration
            - field: memory_bytes
              label: Memory
              format: bytes
            - field: save_bytes
              label: World size
              format: bytes
            - field: update_status
              label: Build
              format: text
