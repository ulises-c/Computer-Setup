- Game server:
    - glances:
        icon: sh-glances.svg
        href: https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}/glances/
        description: System monitor
        server: my-docker
        container: glances
        widget:
          type: glances
          url: http://127.0.0.1:61208
          version: 4
          metric: cpu
    - portainer:
        icon: sh-portainer-light.svg
        href: https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}:9443/
        description: Docker manager
        server: my-docker
        container: portainer
    - watchtower:
        icon: sh-watchtower.svg
        description: Automatic container updates
        server: my-docker
        container: watchtower
    - cockpit:
        icon: sh-cockpit-light.svg
        href: https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}/cockpit/
        description: Server admin UI
        ping: https://127.0.0.1:9090
    - backups:
        icon: sh-restic
        description: restic → main server (wd1tb + wd14tb)
        server: my-docker
        container: backup-status
        widget:
          type: customapi
          url: http://127.0.0.1:8099/backup-status.json
          refreshInterval: 600000
          mappings:
            - field: status
              label: Status
              format: text
            - field: last_run
              label: Last run
              format: relativeDate
            - field: repo_size_bytes
              label: Repo size
              format: bytes
    - rgb lighting:
        icon: mdi-palette
        description: OpenRGB devices and active mode (refreshed every 10 min)
        widget:
          type: customapi
          url: https://{{HOMEPAGE_VAR_GAME_HOMEPAGE_DOMAIN}}/host-status/rgb.json
          refreshInterval: 300000
          display: dynamic-list
          mappings:
            items: devices
            name: name
            label: mode

- Games:
    - "RuneScape: Dragonwilds":
        id: dragonwilds-server
        icon: /icons/dragonwilds.ico
        description: Native dedicated server — process, installation and sampled 24h resources
        widget:
          type: customapi
          url: http://127.0.0.1:8096/dragonwilds-status.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: status
              label: Server
              format: text
            - field: server_name
              label: Name
              format: text
            - field: game_version
              label: Running version
              format: text
            - field: build
              label: Steam build
              format: text
            - field: uptime_seconds
              label: Uptime
              format: duration
            - field: cpu_current
              label: CPU current (1 core)
              format: text
            - field: cpu_avg
              label: CPU avg (24h sampled)
              format: text
            - field: cpu_max
              label: CPU max (24h sampled)
              format: text
            - field: memory_current
              label: Memory current
              format: text
            - field: memory_avg
              label: Memory avg (24h sampled)
              format: text
            - field: memory_max
              label: Memory max (24h sampled)
              format: text
            - field: sample_window
              label: Sample coverage
              format: text
            - field: tasks_current
              label: Tasks / threads
              format: text
            - field: restarts
              label: Automatic restarts
              format: text
            - field: installation_footprint
              label: Installation on disk
              format: text
            - field: world_count
              label: World saves
              format: text
            - field: worlds_on_disk
              label: Worlds on disk
              format: text
            - field: update_status
              label: Update
              format: text
            - field: update_checked
              label: Checked
              format: relativeDate
            - field: auto_update
              label: Auto-update
              format: text
            - field: backup_status
              label: Backup
              format: text
            - field: last_backup
              label: Last backup
              format: relativeDate
    - Active world:
        id: dragonwilds-world
        icon: /icons/dragonwilds.ico
        description: Active save — players and joining (LAN + tailnet)
        widget:
          type: customapi
          url: http://127.0.0.1:8096/dragonwilds-status.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: world
              label: World
              format: text
            - field: world_id
              label: World ID
              format: text
            - field: world_owner
              label: Owner
              format: text
            - field: online_capacity
              label: Players
              format: text
            - field: player_names
              label: Online
              format: text
            - field: last_join_name
              label: Last join
              format: text
            - field: last_join
              label: Last join at
              format: relativeDate
            - field: join_code
              label: Join code
              format: text
            - field: join_password
              label: Join pass
              format: text
            - field: connect_lan
              label: LAN
              format: text
            - field: connect_tailnet
              label: Tailnet
              format: text
            - field: last_save
              label: Last save
              format: relativeDate
            - field: save_bytes
              label: World size
              format: bytes
