# shellcheck shell=bash
# Sourced by server-base/serve.sh (bash). See that file for the variables.
# shellcheck disable=SC2034
COMPOSE_DIRS=(homepage portainer watchtower status)
PRE_SERVE=(python3 scaffold.py)
WAIT_URL=http://127.0.0.1:3000/
ROUTES=(
  "443 / http://127.0.0.1:3000"
  # Native Glances (agents.sh); its web UI uses relative URLs.
  "443 /glances http://127.0.0.1:61208"
  # Portainer ignores --base-url for some assets (portainer#12615), so it keeps a port.
  "9443 / http://127.0.0.1:9000"
  # Hermes WebUI owned / before Homepage; it moved to its own port rather than
  # a sub-path, which it was not built for.
  "8787 / http://127.0.0.1:8787"
)
RETIRED_PORTS=()
RETIRED_PATHS=()
