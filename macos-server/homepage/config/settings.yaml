# Generated by server-base/homepage/generate.py from server-base/fleet.json and
# macos-server/homepage/settings.local.yaml. Edit those, then re-run the generator.
title: "Mac Server"
theme: "dark"
color: "slate"
headerStyle: "boxed"
hideVersion: true
fullWidth: true
cardBlur: "sm"
useEqualHeights: true
topbarExtras:
  glances: "https://{{HOMEPAGE_VAR_MAC_HOMEPAGE_DOMAIN}}/glances"
  net: "en0"
  grouped: true
  label: "mac server"
  disks:
    - "/System/Volumes/Data"
  safeSSDHealth: false
  filesystemIntervalMs: 300000
  smartIntervalMs: 600000
  gpu: false
  wifi: false
  diskLabels:
    /System/Volumes/Data: "System disk"

layout:
  Servers:
    style: row
    columns: 4
  Mac server:
    style: row
    columns: 3
  Mac services:
    style: row
    columns: 2
  Shared services:
    style: row
    columns: 3
