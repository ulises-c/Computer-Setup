services:
  # Loopback nginx serving this host's status JSON (backup, LaunchAgents) to Homepage.
  host-status:
    image: nginx:alpine
    container_name: host-status
    restart: unless-stopped
    env_file:
      - path: ../../server-base/timezone.env
        required: true
    ports:
      - "127.0.0.1:8099:80"
    volumes:
      - ./www:/usr/share/nginx/html:ro
