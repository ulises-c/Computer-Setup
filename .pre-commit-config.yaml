repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: local
    hooks:
      - id: zsh-syntax-check
        name: zsh -n (syntax check)
        language: system
        entry: zsh -n
        types: [file]
        files: (\.zsh$|zshrc\.example$)

      - id: validate-packages
        name: validate packages.json schema
        language: system
        entry: bash scripts/validate-packages.sh
        files: ^packages\.json$
        pass_filenames: false

      - id: python-syntax-check
        name: python syntax check
        language: system
        entry: bash scripts/check-python-syntax.sh
        types: [python]

      - id: privacy-check
        name: no identifying values in staged changes
        language: system
        entry: python3 scripts/check-privacy.py --staged
        pass_filenames: false
        always_run: true

      - id: privacy-check-message
        name: no identifying values in the commit message
        language: system
        entry: python3 scripts/check-privacy.py --message
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
