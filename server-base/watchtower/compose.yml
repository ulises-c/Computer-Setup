services:
  # Nightly image updates for every server's containers. No listener unless a
  # host enables the HTTP metrics API.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_SCHEDULE: "0 0 3 * * *"   # 3am daily (6-field cron: sec min hr dom mon dow)
      WATCHTOWER_CLEANUP: "true"           # remove old images after updating
      DOCKER_API_VERSION: "1.40"           # override default 1.25, which Docker 29.x rejects
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
