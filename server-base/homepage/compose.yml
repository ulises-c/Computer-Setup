services:
  # Dashboard shared by every server. Host networking so the resources widget
  # reports the host and loopback-only helpers (Glances, status JSONs) are
  # reachable. Hosts extend this service and add their own config mount,
  # env_file, assets mounts and HOMEPAGE_ALLOWED_HOSTS; relative paths in an
  # extended file resolve against this directory, not the host's.
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.4.0
    container_name: homepage
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: ../timezone.env
        required: true
    environment:
      HOSTNAME: "127.0.0.1"
      PORT: "3000"

  # Homepage reaches Docker only through this filter (config/docker.yaml:
  # 127.0.0.1:2375), never through the socket itself, so a host may expose
  # Homepage on its LAN. Container status and stats are the only two calls
  # Homepage makes; everything else is refused. Hosts extend this service too.
  docker-socket-proxy:
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    container_name: homepage-docker-proxy
    restart: unless-stopped
    network_mode: host
    # Root only to open the socket without a per-host docker GID; it holds no
    # capabilities and cannot gain any.
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ../timezone.env
        required: true
    command:
      - -listenip=127.0.0.1
      - -proxyport=2375
      - -allowfrom=127.0.0.1/32
      - -allowGET=(/v1\.[0-9]+)?/containers/(json|[0-9a-f]{64}/stats)(\?.*)?
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
